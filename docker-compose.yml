services:
  db:
    image: mysql:8.0
    container_name: ircc_world
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: irccRoot
      MYSQL_DATABASE: ircc
      MYSQL_USER: ircc_user
      MYSQL_PASSWORD: irccPassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: